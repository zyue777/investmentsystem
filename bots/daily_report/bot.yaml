# bots/daily_report/bot.yaml
name: daily_report
label: "每日报告Bot"
enabled: false   # 由 bots/daily_report/scheduler_runner.py 独立运行，不经过 Agent Hub BotLoader
description: "定时推送每日行情报告（晨报/午间复盘/收盘复盘/周末汇总）"
channel: scheduler          # 由内置 APScheduler 驱动，不监听飞书消息
channel_config:
  timezone: "Asia/Shanghai"
ai_provider: litellm
feishu_app_id: ${FEISHU_DS_APP_ID}       # 复用 DS Bot 的飞书应用推送
feishu_app_secret: ${FEISHU_DS_APP_SECRET}
max_concurrent: 2
default_timeout: 120
global_hooks: [audit]                    # 只记日志，不需要 dedup/auth/timer
