# bots/investment_ds/bot.yaml
name: investment_ds
label: "投研Bot(DS)"
enabled: true
description: "AI投研助手（DeepSeek版）"
channel: feishu_ws
channel_config:
  app_id: ${FEISHU_DS_APP_ID}
  app_secret: ${FEISHU_DS_APP_SECRET}
ai_provider: deepseek_api
workspace: "/home/zy/桌面/投研工作台"
max_concurrent: 5
default_timeout: 300
global_hooks: [dedup, auth, timer, audit]
# 文件消息类型 → Skill 路由（新增文件类型只需在这里加一行，无需改代码）
file_skill_routes:
  file: ingest_file    # Word / PDF / TXT 等
  doc:  ingest_file    # 飞书在线文档
  # image: ingest_image   # 未来：图片识别 Skill（取消注释即启用）
  # audio: ingest_audio   # 未来：语音转写 Skill（取消注释即启用）
